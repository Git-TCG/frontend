map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Cloudflare terminates TLS. Keep the visitor scheme so OAuth redirect_uri stays https.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;

  # API와 대전 WebSocket은 같은 Origin의 /api 로 받는다.
  # Docker 내장 DNS로 매번 이름을 풀어, API 컨테이너가 다시 떠도 옛 IP에 묶이지 않게 한다.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:3000;
  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
